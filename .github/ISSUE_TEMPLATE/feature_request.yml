name: Feature discussion
description: Discuss a scoped change without assuming it will be scheduled
title: "[Discussion]: "
labels: [discussion]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and compatibility impact
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials, private host data, device identifiers, or session content.
          required: true
