name: Compatibility report
description: Discuss compatibility with a DSH version or environment
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: "The supported preview target is DSH 0.1.2-rc.1. DSH 0.1.5 adaptation is in progress and is not supported yet. Redact all private data."
  - type: input
    id: dsh_version
    attributes:
      label: Exact DSH version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Redacted environment
      description: Operating system and runtime only; omit hostnames, IPs, and device IDs.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result and minimal reproduction
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, authorization URLs, real host data, device identifiers, and session content.
          required: true
