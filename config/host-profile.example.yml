# Secret-free example. Store secret values in the platform credential store.
hosts:
  - hostId: remote-linux
    label: Remote Linux
    host: 192.0.2.10
    port: 22
    user: example-user
    auth: privateKey
    keyPath: C:\Users\example\.ssh\id_ed25519
    passphraseRef: ssh/remote-linux/passphrase
    dshPort: 3080
    enabled: false
